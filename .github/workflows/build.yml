name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build NewDesk.sln -c Release

      - name: Test
        run: dotnet test tests/NewDesk.Core.Tests -c Release --no-build

      # Self-contained, so the test PC does not need .NET installed.
      # Shell and watchdog go into the same folder: the shell refuses to run without the watchdog next to it.
      - name: Publish
        run: |
          dotnet publish src/NewDesk.Shell -c Release -r win-x64 --self-contained -o out/NewDesk
          dotnet publish src/NewDesk.Watchdog -c Release -r win-x64 --self-contained -o out/NewDesk
          Copy-Item tools/restore-taskbar.ps1 out/NewDesk/
          if (-not (Test-Path out/NewDesk/NewDesk.Watchdog.exe)) { throw "watchdog missing from the package" }

      - uses: actions/upload-artifact@v4
        with:
          name: NewDesk-win-x64
          path: out/NewDesk
